name: Live endpoint smoke test

# The tests in tests/test_all_endpoints.py call api.dexpaprika.com for real. They
# are marked `live` and excluded from the push path, because a rate-limited or
# briefly unreachable API is not a reason to fail someone's commit. They are still
# worth running: they are how we notice an endpoint changing shape under us.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-endpoints
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -e .
      - name: Run the live suite
        # -p no:randomly and no parallelism on purpose: keyless traffic is capped
        # at 30 requests a minute and the suite paces itself with a 2.5s gap.
        run: pytest -m live -v
