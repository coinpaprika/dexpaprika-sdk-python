name: Live endpoint smoke test

# The tests in tests/test_all_endpoints.py call api.dexpaprika.com for real. They
# are marked `live` and excluded from the push path, because a rate-limited or
# briefly unreachable API is not a reason to fail someone's commit. They are still
# worth running: they are how we notice an endpoint changing shape under us.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-endpoints
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -e .
      - name: Run the live suite
        # No parallelism on purpose. The per-minute limit is 15 keyless and 30
        # with a free key, and the suite paces itself from DEXPAPRIKA_API_KEY:
        # 4.2s between calls without one, 2.1s with one.
        #
        # The key is optional and the secret may be unset, in which case this
        # runs keyless and simply takes longer. Setting it is still worth doing:
        # the keyless allowance is per IP, and a shared GitHub runner address is
        # a bad place to bet on having the whole bucket to yourself.
        run: pytest -m live -v
        env:
          DEXPAPRIKA_API_KEY: ${{ secrets.DEXPAPRIKA_API_KEY }}
