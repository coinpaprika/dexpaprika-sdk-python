name: Publish Python Package

# Fires on the tag, not on the release.
#
# It used to trigger on `release: created`, which silently never ran once
# release.yml started cutting releases automatically: GitHub does not trigger
# workflows from events raised with the default GITHUB_TOKEN, so a bot-created
# release is a dead end. v0.9.0 was tagged, the release was created, and nothing
# reached PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI exchanges this job's OIDC token for a short-lived
    # upload credential, scoped to this repository, this workflow file and this
    # environment. No PyPI token is stored as a repository secret any more, so
    # publishing authority is no longer equal to plain repository write access.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build
      run: |
        python -m build
        twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      # --skip-existing: a tag can be pushed more than once, and v0.9.0 was pushed
      # three times. Without it the second push after a successful upload gets
      # HTTP 400 File already exists, turning the job red for a release that in fact
      # shipped correctly. A red X that does not mean anything is how the 0.4.0
      # failure went unnoticed for five months.
      with:
        skip-existing: true 