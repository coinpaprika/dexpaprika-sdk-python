name: Publish Python Package

# Fires on the tag, not on the release.
#
# It used to trigger on `release: created`, which silently never ran once
# release.yml started cutting releases automatically: GitHub does not trigger
# workflows from events raised with the default GITHUB_TOKEN, so a bot-created
# release is a dead end. v0.9.0 was tagged, the release was created, and nothing
# reached PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build and publish
      env:
        # PyPI stopped accepting username and password. The old PYPI_USERNAME /
        # PYPI_PASSWORD pair returns 403 Forbidden from upload.pypi.org, which is
        # what the 2026-08-14 run failed on. An API token is used as the password
        # with the literal username __token__.
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m build
        twine check dist/*
        twine upload dist/* 